services:
  regime-sleeve:
    build: .
    image: regime-sleeve:latest
    container_name: regime-sleeve
    # Host port is configurable; the container always listens on 8080.
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Fixed inside the container; overrides any PORT in .env.
      PORT: "8080"
    # Optional secrets/overrides (BITGET_US_MCP_URL, QWEN_API_KEY, ...).
    # Missing file is fine.
    env_file:
      - path: .env
        required: false
    volumes:
      - regime-cache:/app/.cache
    restart: unless-stopped

volumes:
  regime-cache:
